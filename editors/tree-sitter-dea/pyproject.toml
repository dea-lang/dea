[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-dea"
description = "Tree-sitter grammar for the Dea L0 and L1 languages"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "dea"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Guglielmo Nigri", email = "googlielmo@gmail.com" }]
requires-python = ">=3.10"
license.text = "MIT OR Apache-2.0"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/googlielmo/dea-lang"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
