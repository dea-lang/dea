[package]
name = "tree-sitter-dea"
description = "Tree-sitter grammar for the Dea L0 and L1 languages"
version = "0.1.0"
authors = ["Guglielmo Nigri <googlielmo@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "dea"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/dea-lang/dea"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"
