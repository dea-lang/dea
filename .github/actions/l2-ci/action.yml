name: L2 CI Delegate

description: Validate canonical L2 through an explicit predecessor, with optional Linux isolation.

inputs:
  make_target:
    description: Make target to run in l2/
    required: true
  c_compiler:
    description: Native compiler selected for bootstrap and target operations
    required: true
  artifact_name_suffix:
    description: Artifact suffix
    required: true
  bootstrap_l0c:
    description: Explicit same-run L0 compiler for preparing a missing L1 bootstrap
    required: false
    default: ""
  bootstrap_l1c:
    description: Explicit same-run L1 compiler; prepare one only when this is empty
    required: false
    default: ""
  bootstrap_mode:
    description: Installed bootstrap by default, or development for coordinated CI reuse
    required: false
    default: installed
  run_isolation:
    description: Explicitly run the additional Linux Docker isolation gate
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Select explicit L1 bootstrap and validate L2
      if: runner.os != 'Windows'
      shell: bash
      env:
        L0_CC: ${{ inputs.c_compiler }}
        L1_CC: ${{ inputs.c_compiler }}
        L1_RUNTIME_CC: ${{ inputs.c_compiler }}
        L2_CC: ${{ inputs.c_compiler }}
        L2_RUNTIME_CC: ${{ inputs.c_compiler }}
        CI_MAKE_TARGET: ${{ inputs.make_target }}
        CI_BOOTSTRAP_L0C: ${{ inputs.bootstrap_l0c }}
        CI_BOOTSTRAP_L1C: ${{ inputs.bootstrap_l1c }}
        CI_BOOTSTRAP_MODE: ${{ inputs.bootstrap_mode }}
      run: |
        command -v "$L2_CC"
        "$L2_CC" --version
        python3 scripts/ci_bootstrap.py l2

    - name: Select explicit L1 bootstrap and validate L2 (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        L0_CC: ${{ inputs.c_compiler }}
        L1_CC: ${{ inputs.c_compiler }}
        L1_RUNTIME_CC: ${{ inputs.c_compiler }}
        L2_CC: ${{ inputs.c_compiler }}
        L2_RUNTIME_CC: ${{ inputs.c_compiler }}
        CI_MAKE_TARGET: ${{ inputs.make_target }}
        CI_BOOTSTRAP_L0C: ${{ inputs.bootstrap_l0c }}
        CI_BOOTSTRAP_L1C: ${{ inputs.bootstrap_l1c }}
        CI_BOOTSTRAP_MODE: ${{ inputs.bootstrap_mode }}
        PYTHON: python
      run: |
        command -v "$L2_CC"
        "$L2_CC" --version
        python scripts/ci_bootstrap.py l2

    - name: Verify Linux checkout and bootstrap isolation
      if: runner.os == 'Linux' && inputs.run_isolation == 'true'
      shell: bash
      run: |
        prefix="$RUNNER_TEMP/l2-bookworm-bootstrap"
        mkdir -p "$prefix"
        docker build -f l1/Dockerfile -t dea-l2-bootstrap-builder .
        docker run --rm -e L0_CC=gcc -e L1_CC=gcc -e L1_RUNTIME_CC=gcc \
          -v "$prefix:/output/l1" dea-l2-bootstrap-builder make install PREFIX=/output/l1
        L2_ISOLATION_BOOTSTRAP_PREFIX="$prefix" make -C l2 test-isolation

    - name: Upload L2 workdir artifact
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: l2-workdir-${{ inputs.artifact_name_suffix }}
        path: |
          .github/workflows/l2-ci.yml
          l2
          !l2/.git/**
        if-no-files-found: warn
        retention-days: 2
