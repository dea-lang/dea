name: L0 CI Delegate

description: Run L0 CI target for the current runner environment.

inputs:
  make_target:
    description: Make target to run in l0/
    required: true
  c_compiler:
    description: C compiler selection
    required: true
  artifact_name_suffix:
    description: Artifact suffix (usually platform-compiler)
    required: true

outputs:
  bootstrap_l0c:
    description: Validated repo-local L0 Stage 2 compiler, or empty if the target produced none
    value: ${{ steps.run.outputs.bootstrap_l0c || steps.run-windows.outputs.bootstrap_l0c }}

runs:
  using: composite
  steps:
    - name: Run L0 Make target
      id: run
      if: runner.os != 'Windows'
      shell: bash
      env:
        L0_CC: ${{ inputs.c_compiler }}
        CI_MAKE_TARGET: ${{ inputs.make_target }}
      run: python3 scripts/ci_bootstrap.py l0

    - name: Run L0 Make target (Windows)
      id: run-windows
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        DEA_DEBUG_VENV: "1"
        L0_CC: ${{ inputs.c_compiler }}
        PYTHON: python
        CI_MAKE_TARGET: ${{ inputs.make_target }}
      run: python scripts/ci_bootstrap.py l0

    - name: Upload L0 workdir artifact
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: l0-workdir-${{ inputs.artifact_name_suffix }}
        path: |
          l0
          !l0/.git/**
        if-no-files-found: warn
        retention-days: 2
