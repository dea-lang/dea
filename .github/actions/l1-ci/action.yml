name: L1 CI Delegate

description: Run L1 CI target for the current runner environment.

inputs:
  make_target:
    description: Make target to run in l1/
    required: true
  c_compiler:
    description: C compiler selected for L0_CC, L1_CC, and L1_RUNTIME_CC
    required: true
  artifact_name_suffix:
    description: Artifact suffix (usually platform-compiler)
    required: true
  bootstrap_l0c:
    description: Explicit same-run L0 Stage 2 compiler handoff
    required: false
    default: ""

outputs:
  bootstrap_l1c:
    description: Validated development L1 toolchain, or empty if the target produced none
    value: ${{ steps.run.outputs.bootstrap_l1c || steps.run-windows.outputs.bootstrap_l1c }}

runs:
  using: composite
  steps:
    - name: Show selected L1 toolchain
      if: runner.os != 'Windows'
      shell: bash
      env:
        L0_CC: ${{ inputs.c_compiler }}
        L1_CC: ${{ inputs.c_compiler }}
        L1_RUNTIME_CC: ${{ inputs.c_compiler }}
      run: |
        missing=0
        for role in L0_CC L1_CC L1_RUNTIME_CC; do
          compiler="${!role}"
          if ! resolved="$(command -v "${compiler}" 2>/dev/null)"; then
            printf '%s: configured=%s; resolved=<not found>; version=<unavailable>\n' \
              "${role}" "${compiler}"
            missing=1
            continue
          fi
          version_line="$("${resolved}" --version 2>&1 | sed -n '1p' || true)"
          if [ -z "${version_line}" ]; then
            version_line='<unavailable>'
          fi
          printf '%s: configured=%s; resolved=%s; version=%s\n' \
            "${role}" "${compiler}" "${resolved}" "${version_line}"
        done
        exit "${missing}"

    - name: Run L1 Make target
      id: run
      if: runner.os != 'Windows'
      shell: bash
      env:
        L0_CC: ${{ inputs.c_compiler }}
        L1_CC: ${{ inputs.c_compiler }}
        L1_RUNTIME_CC: ${{ inputs.c_compiler }}
        CI_BOOTSTRAP_L0C: ${{ inputs.bootstrap_l0c }}
        CI_MAKE_TARGET: ${{ inputs.make_target }}
      run: python3 scripts/ci_bootstrap.py l1

    - name: Show selected L1 toolchain (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        L0_CC: ${{ inputs.c_compiler }}
        L1_CC: ${{ inputs.c_compiler }}
        L1_RUNTIME_CC: ${{ inputs.c_compiler }}
      run: |
        missing=0
        for role in L0_CC L1_CC L1_RUNTIME_CC; do
          compiler="${!role}"
          if ! resolved="$(command -v "${compiler}" 2>/dev/null)"; then
            printf '%s: configured=%s; resolved=<not found>; version=<unavailable>\n' \
              "${role}" "${compiler}"
            missing=1
            continue
          fi
          version_line="$("${resolved}" --version 2>&1 | sed -n '1p' || true)"
          if [ -z "${version_line}" ]; then
            version_line='<unavailable>'
          fi
          printf '%s: configured=%s; resolved=%s; version=%s\n' \
            "${role}" "${compiler}" "${resolved}" "${version_line}"
        done
        exit "${missing}"

    - name: Run L1 Make target (Windows)
      id: run-windows
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        L0_CC: ${{ inputs.c_compiler }}
        L1_CC: ${{ inputs.c_compiler }}
        L1_RUNTIME_CC: ${{ inputs.c_compiler }}
        CI_BOOTSTRAP_L0C: ${{ inputs.bootstrap_l0c }}
        CI_MAKE_TARGET: ${{ inputs.make_target }}
      run: '"$HOST_PYTHON" scripts/ci_bootstrap.py l1'

    - name: Report L1 preparation reuse
      if: always() && runner.os != 'Windows'
      shell: bash
      env:
        L1_CC: ${{ inputs.c_compiler }}
      run: python3 l1/scripts/check_preparation_reuse.py --c-compiler "$L1_CC" --expect available

    - name: Report L1 preparation reuse (Windows)
      if: always() && runner.os == 'Windows'
      shell: msys2 {0}
      env:
        L1_CC: ${{ inputs.c_compiler }}
      run: '"$HOST_PYTHON" l1/scripts/check_preparation_reuse.py --c-compiler "$L1_CC" --expect available'

    - name: Publish L1 preparation summary
      if: always() && runner.os != 'Windows'
      shell: bash
      run: |
        report=l1/build/ci/preparation-reuse
        if [ ! -s "$report/report.json" ] || [ ! -s "$report/summary.md" ]; then
          mkdir -p "$report"
          printf '%s\n' '{"capability":"error","result":"FAIL","reason":"preparation reporter did not produce a complete report"}' > "$report/report.json"
          printf '%s\n' '## L1 native preparation' '' 'FAIL: preparation reporter did not produce a complete report; inspect the reporting step.' > "$report/summary.md"
          cat "$report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        cat "$report/summary.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Publish L1 preparation summary (Windows)
      if: always() && runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        report=l1/build/ci/preparation-reuse
        summary="$(cygpath -u "$GITHUB_STEP_SUMMARY")"
        if [ ! -s "$report/report.json" ] || [ ! -s "$report/summary.md" ]; then
          mkdir -p "$report"
          printf '%s\n' '{"capability":"error","result":"FAIL","reason":"preparation reporter did not produce a complete report"}' > "$report/report.json"
          printf '%s\n' '## L1 native preparation' '' 'FAIL: preparation reporter did not produce a complete report; inspect the reporting step.' > "$report/summary.md"
          cat "$report/summary.md" >> "$summary"
          exit 1
        fi
        cat "$report/summary.md" >> "$summary"

    - name: Upload L1 workdir artifact
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: l1-workdir-${{ inputs.artifact_name_suffix }}
        path: |
          .github/workflows/l1-ci.yml
          l1
          !l1/.git/**
        if-no-files-found: warn
        retention-days: 2
