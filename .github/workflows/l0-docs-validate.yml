name: L0 Validate Documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: l0
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: docs-py3.14-ws

      - name: Install docs toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz make texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Show Doxygen version
        run: doxygen --version

      - name: Sync docs dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --group docs

      - name: Build docs strictly
        run: python3 scripts/gen_docs.py --stage all --strict --pdf --artifacts

      - name: Show undocumented functions report
        if: always()
        run: |
          for stage in stage1 stage2; do
            report_path="build/docs/$stage/undocumented-functions.txt"
            if [ -f "$report_path" ]; then cat "$report_path"; fi
          done

      - name: Export Chirpy Markdown
        run: |
          python -m compiler.docgen.l0_docgen_blog --stage stage2 \
            --input build/docs/stage2/markdown \
            --output build/docs/api-reference

      - name: Upload Stage 1 developer reference
        uses: actions/upload-artifact@v6
        with:
          name: l0-docs-validation-stage1-autodocs
          path: l0/build/docs/artifacts/dea_l0_stage1_autodocs.tar.gz
          if-no-files-found: error

      - name: Upload Stage 2 validation reference
        uses: actions/upload-artifact@v6
        with:
          name: l0-docs-validation-stage2-autodocs
          path: l0/build/docs/artifacts/dea_l0_stage2_autodocs.tar.gz
          if-no-files-found: error
