name: L0 Validate Documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: l0
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: docs-py3.14-ws

      - name: Install docs toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz make

      - name: Show Doxygen version
        run: doxygen --version

      - name: Sync docs dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --group docs

      - name: Build docs strictly
        run: python3 scripts/gen_docs.py --strict

      - name: Show undocumented functions report
        if: always()
        run: |
          report_path="build/docs/undocumented-functions.txt"
          if [ -f "$report_path" ]; then
            cat "$report_path"
          else
            echo "No undocumented functions report was generated."
          fi

      - name: Export Chirpy Markdown
        run: |
          python -m compiler.docgen.l0_docgen_blog \
            --input build/docs/markdown \
            --output build/docs/api-reference
