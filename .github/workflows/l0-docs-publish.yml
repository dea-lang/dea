name: L0 Publish Documentation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build docs from"
        required: false
        default: ""
        type: string
      publish_pages:
        description: "Deploy standalone HTML + PDF to GitHub Pages"
        required: true
        default: true
        type: boolean
      publish_blog:
        description: "Build the Chirpy-compatible Dea/L0 API reference export archive"
        required: true
        default: false
        type: boolean
      attach_release_assets_to_draft:
        description: "Attach release PDF/API reference export assets to an existing draft release"
        required: true
        default: false
        type: boolean
      draft_release:
        description: "Draft release URL or numeric GitHub release ID for draft-release asset attachment"
        required: false
        default: ""
        type: string
      release_tag:
        description: "Release tag for release-oriented docs/API reference export publishing when not targeting a draft release by URL/ID"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: l0-docs-publish
  cancel-in-progress: false

jobs:
  resolve-draft-release:
    if: inputs.attach_release_assets_to_draft
    runs-on: ubuntu-latest
    outputs:
      resolved_release_id: ${{ steps.resolve.outputs.resolved_release_id }}
      resolved_release_tag: ${{ steps.resolve.outputs.resolved_release_tag }}
      resolved_target_commitish: ${{ steps.resolve.outputs.resolved_target_commitish }}
    steps:
      - name: Resolve target draft release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DRAFT_RELEASE: ${{ inputs.draft_release }}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          draft_release="${INPUT_DRAFT_RELEASE%%\#*}"
          draft_release="${draft_release%%\?*}"
          draft_release="${draft_release%/}"

          if [ -z "$draft_release" ]; then
            echo "Error: draft_release is required when attach_release_assets_to_draft=true." >&2
            exit 1
          fi

          release_id=""
          release_tag=""
          release_api=""

          if ! printf '%s' "$draft_release" | grep -Eq '[^0-9]'; then
            release_id="$draft_release"
            release_api="repos/$GITHUB_REPOSITORY/releases/$release_id"
          else
            release_url_prefix="https://github.com/$REPOSITORY_NAME/releases/tag/"
            case "$draft_release" in
              "$release_url_prefix"*)
                release_tag="${draft_release#"$release_url_prefix"}"
                ;;
              https://github.com/*/releases/tag/*)
                echo "Error: draft_release must target https://github.com/$REPOSITORY_NAME/releases/tag/<tag> when provided as a URL." >&2
                exit 1
                ;;
              *)
                echo "Error: draft_release must be a numeric release ID or a full GitHub release URL." >&2
                exit 1
                ;;
            esac
            if [ -z "$release_tag" ] || [ "$release_tag" = "$draft_release" ]; then
              echo "Error: draft_release URL must include a release tag after /releases/tag/." >&2
              exit 1
            fi
            release_api="repos/$GITHUB_REPOSITORY/releases/tags/$release_tag"
          fi

          if ! gh api "$release_api" >/tmp/dea-l0-draft-release.json 2>/dev/null; then
            if [ -n "$release_id" ]; then
              echo "Error: draft release $release_id does not exist." >&2
            else
              echo "Error: draft release $release_tag does not exist." >&2
            fi
            exit 1
          fi

          release_id="$(gh api "$release_api" --jq '.id')"
          is_draft="$(gh api "$release_api" --jq '.draft')"
          if [ "$is_draft" != "true" ]; then
            echo "Error: immutable-release violation: release $release_id is already published." >&2
            exit 1
          fi

          resolved_tag="$(gh api "$release_api" --jq '.tag_name')"
          resolved_target_commitish="$(gh api "$release_api" --jq '.target_commitish')"

          echo "resolved_release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "resolved_release_tag=$resolved_tag" >> "$GITHUB_OUTPUT"
          echo "resolved_target_commitish=$resolved_target_commitish" >> "$GITHUB_OUTPUT"

  resolve-targets:
    needs: resolve-draft-release
    if: >-
      always() &&
      (needs.resolve-draft-release.result == 'success' || needs.resolve-draft-release.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      target_release_tag: ${{ steps.resolve.outputs.target_release_tag }}
      resolved_release_id: ${{ steps.resolve.outputs.resolved_release_id }}
      resolved_release_tag: ${{ steps.resolve.outputs.resolved_release_tag }}
      resolved_target_commitish: ${{ steps.resolve.outputs.resolved_target_commitish }}
    steps:
      - name: Resolve source ref and release tag
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_DRAFT_ATTACH: ${{ inputs.attach_release_assets_to_draft }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          RESOLVED_RELEASE_ID: ${{ needs.resolve-draft-release.outputs.resolved_release_id }}
          RESOLVED_RELEASE_TAG: ${{ needs.resolve-draft-release.outputs.resolved_release_tag }}
          RESOLVED_TARGET_COMMITISH: ${{ needs.resolve-draft-release.outputs.resolved_target_commitish }}
          DEFAULT_REF: ${{ github.ref_name }}
        run: |
          source_ref="$INPUT_REF"
          target_release_tag="$INPUT_RELEASE_TAG"
          if [ "$INPUT_DRAFT_ATTACH" = "true" ]; then
            target_release_tag="$RESOLVED_RELEASE_TAG"
          fi
          if [ -z "$source_ref" ] && [ "$INPUT_DRAFT_ATTACH" = "true" ]; then
            source_ref="$RESOLVED_TARGET_COMMITISH"
          fi
          if [ -z "$source_ref" ] && [ -n "$INPUT_RELEASE_TAG" ]; then
            source_ref="$INPUT_RELEASE_TAG"
          fi
          if [ -z "$source_ref" ]; then
            source_ref="$DEFAULT_REF"
          fi

          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "target_release_tag=$target_release_tag" >> "$GITHUB_OUTPUT"
          echo "resolved_release_id=$RESOLVED_RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "resolved_release_tag=$RESOLVED_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "resolved_target_commitish=$RESOLVED_TARGET_COMMITISH" >> "$GITHUB_OUTPUT"

  check-pages-availability:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.probe.outputs.pages_enabled }}
    steps:
      - name: Check GitHub Pages availability
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "pages_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is unavailable or not activated for $GITHUB_REPOSITORY; skipping Pages deployment."
            echo "pages_enabled=false" >> "$GITHUB_OUTPUT"
          fi

  build-docs:
    needs: resolve-targets
    uses: ./.github/workflows/l0-docs-build.yml
    with:
      source_ref: ${{ needs.resolve-targets.outputs.source_ref }}
      release_tag: ${{ needs.resolve-targets.outputs.target_release_tag }}
      build_pdf: >-
        ${{
          inputs.publish_pages == true ||
          inputs.publish_blog == true ||
          inputs.attach_release_assets_to_draft == true
        }}

  deploy-pages:
    needs:
      - check-pages-availability
      - build-docs
    if: >-
      needs.check-pages-availability.outputs.pages_enabled == 'true' &&
      inputs.publish_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  attach-release-assets:
    needs:
      - resolve-draft-release
      - resolve-targets
      - build-docs
      - deploy-pages
    if: >-
      always() &&
      needs.resolve-draft-release.result == 'success' &&
      needs.resolve-targets.result == 'success' &&
      needs.build-docs.result == 'success' &&
      (needs.deploy-pages.result == 'success' || needs.deploy-pages.result == 'skipped') &&
      inputs.attach_release_assets_to_draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: l0
    steps:
      - name: Check out source repository
        if: inputs.publish_blog
        uses: actions/checkout@v6

      - name: Require target draft release
        env:
          RESOLVED_RELEASE_ID: ${{ needs.resolve-draft-release.outputs.resolved_release_id }}
        run: |
          if [ -z "$RESOLVED_RELEASE_ID" ]; then
            echo "Error: draft_release resolution did not produce a release ID." >&2
            exit 1
          fi

      - name: Validate target draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_RELEASE_ID: ${{ needs.resolve-draft-release.outputs.resolved_release_id }}
        run: |
          release_api="repos/$GITHUB_REPOSITORY/releases/$RESOLVED_RELEASE_ID"
          if ! gh api "$release_api" >/dev/null 2>&1; then
            echo "Error: draft release $RESOLVED_RELEASE_ID does not exist." >&2
            exit 1
          fi
          is_draft="$(gh api "$release_api" --jq '.draft')"
          if [ "$is_draft" != "true" ]; then
            echo "Error: immutable-release violation: release $RESOLVED_RELEASE_ID is already published." >&2
            exit 1
          fi

      - name: Download PDF artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-pdf
          path: l0/build/docs/pdf

      - name: Upload PDF to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_RELEASE_ID: ${{ needs.resolve-draft-release.outputs.resolved_release_id }}
          RESOLVED_RELEASE_TAG: ${{ needs.resolve-draft-release.outputs.resolved_release_tag }}
        run: |
          stable_pdf="build/docs/pdf/dea_l0_api_reference.pdf"
          release_pdf="build/docs/pdf/dea_l0_api_reference-$RESOLVED_RELEASE_TAG.pdf"
          asset_name="$(basename "$release_pdf")"
          cp "$stable_pdf" "$release_pdf"
          release_api="repos/$GITHUB_REPOSITORY/releases/$RESOLVED_RELEASE_ID"
          upload_url="$(gh api "$release_api" --jq '.upload_url' | sed 's/{?name,label}//')"
          existing_asset_ids="$(gh api "$release_api/assets" --paginate --jq ".[] | select(.name == \"$asset_name\") | .id")"
          for asset_id in $existing_asset_ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done
          gh api \
            --method POST \
            -H "Content-Type: application/pdf" \
            --input "$release_pdf" \
            "${upload_url}?name=${asset_name}"

      - name: Download generated Markdown
        if: inputs.publish_blog
        uses: actions/download-artifact@v8
        with:
          name: docs-markdown
          path: l0/build/docs/markdown

      - name: Set up Python
        if: inputs.publish_blog
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Export Chirpy API pages
        if: inputs.publish_blog
        env:
          BLOG_DOCS_PREFIX: ${{ vars.BLOG_DOCS_PREFIX }}
          BLOG_TAB_TITLE: ${{ vars.BLOG_TAB_TITLE }}
          BLOG_TAB_ICON: ${{ vars.BLOG_TAB_ICON }}
          BLOG_TAB_ORDER: ${{ vars.BLOG_TAB_ORDER }}
          DOCS_SITE_URL_OVERRIDE: ${{ vars.DOCS_SITE_URL }}
          PAGE_URL: ${{ needs.deploy-pages.outputs.page_url }}
          TARGET_RELEASE_TAG: ${{ needs.resolve-draft-release.outputs.resolved_release_tag }}
        run: |
          docs_prefix="${BLOG_DOCS_PREFIX:-api/reference}"
          tab_title="${BLOG_TAB_TITLE:-API}"
          tab_icon="${BLOG_TAB_ICON:-fas fa-book}"
          tab_order="${BLOG_TAB_ORDER:-5}"
          if [ -n "$PAGE_URL" ]; then
            html_site_url="$PAGE_URL"
          elif [ -n "$DOCS_SITE_URL_OVERRIDE" ]; then
            html_site_url="$DOCS_SITE_URL_OVERRIDE"
          else
            html_site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          if [ -n "$TARGET_RELEASE_TAG" ]; then
            pdf_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TARGET_RELEASE_TAG}/dea_l0_api_reference-${TARGET_RELEASE_TAG}.pdf"
          else
            pdf_url="${html_site_url%/}/pdf/dea_l0_api_reference.pdf"
          fi
          python -m compiler.docgen.l0_docgen_blog \
            --input build/docs/markdown \
            --output build/docs/api-reference \
            --docs-prefix "$docs_prefix" \
            --tab-title "$tab_title" \
            --tab-icon "$tab_icon" \
            --tab-order "$tab_order" \
            --html-site-url "$html_site_url" \
            --pdf-url "$pdf_url" \
            --release-tag "$TARGET_RELEASE_TAG"

      - name: Create Dea/L0 API reference export archive
        if: inputs.publish_blog
        env:
          RESOLVED_RELEASE_TAG: ${{ needs.resolve-draft-release.outputs.resolved_release_tag }}
        run: tar -czf "dea_l0_api_reference-${RESOLVED_RELEASE_TAG}.tar.gz" -C build/docs/api-reference .

      - name: Upload Dea/L0 API reference export artifact
        if: inputs.publish_blog
        uses: actions/upload-artifact@v6
        with:
          name: blog-export
          path: l0/dea_l0_api_reference-${{ needs.resolve-draft-release.outputs.resolved_release_tag }}.tar.gz

      - name: Upload Dea/L0 API reference export to draft release
        if: inputs.publish_blog
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_RELEASE_ID: ${{ needs.resolve-draft-release.outputs.resolved_release_id }}
          RESOLVED_RELEASE_TAG: ${{ needs.resolve-draft-release.outputs.resolved_release_tag }}
        run: |
          archive_name="dea_l0_api_reference-${RESOLVED_RELEASE_TAG}.tar.gz"
          release_api="repos/$GITHUB_REPOSITORY/releases/$RESOLVED_RELEASE_ID"
          upload_url="$(gh api "$release_api" --jq '.upload_url' | sed 's/{?name,label}//')"
          existing_asset_ids="$(gh api "$release_api/assets" --paginate --jq ".[] | select(.name == \"$archive_name\") | .id")"
          for asset_id in $existing_asset_ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done
          gh api \
            --method POST \
            -H "Content-Type: application/gzip" \
            --input "$archive_name" \
            "${upload_url}?name=${archive_name}"

  upload-blog-export:
    needs:
      - resolve-targets
      - build-docs
      - deploy-pages
      - attach-release-assets
    if: >-
      always() &&
      needs.build-docs.result == 'success' &&
      (needs.deploy-pages.result == 'success' || needs.deploy-pages.result == 'skipped') &&
      (needs.attach-release-assets.result == 'success' || needs.attach-release-assets.result == 'skipped') &&
      inputs.publish_blog &&
      !inputs.attach_release_assets_to_draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: l0
    env:
      GH_TOKEN: ${{ github.token }}
      BLOG_DOCS_PREFIX: ${{ vars.BLOG_DOCS_PREFIX }}
      BLOG_TAB_TITLE: ${{ vars.BLOG_TAB_TITLE }}
      BLOG_TAB_ICON: ${{ vars.BLOG_TAB_ICON }}
      BLOG_TAB_ORDER: ${{ vars.BLOG_TAB_ORDER }}
      DOCS_SITE_URL_OVERRIDE: ${{ vars.DOCS_SITE_URL }}
      PAGE_URL: ${{ needs.deploy-pages.outputs.page_url }}
      TARGET_RELEASE_TAG: ${{ needs.resolve-targets.outputs.target_release_tag }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Download generated Markdown
        uses: actions/download-artifact@v8
        with:
          name: docs-markdown
          path: l0/build/docs/markdown

      - name: Export Chirpy API pages
        run: |
          docs_prefix="${BLOG_DOCS_PREFIX:-api/reference}"
          tab_title="${BLOG_TAB_TITLE:-API}"
          tab_icon="${BLOG_TAB_ICON:-fas fa-book}"
          tab_order="${BLOG_TAB_ORDER:-5}"
          if [ -n "$PAGE_URL" ]; then
            html_site_url="$PAGE_URL"
          elif [ -n "$DOCS_SITE_URL_OVERRIDE" ]; then
            html_site_url="$DOCS_SITE_URL_OVERRIDE"
          else
            html_site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          if [ -n "$TARGET_RELEASE_TAG" ]; then
            pdf_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TARGET_RELEASE_TAG}/dea_l0_api_reference-${TARGET_RELEASE_TAG}.pdf"
          else
            pdf_url="${html_site_url%/}/pdf/dea_l0_api_reference.pdf"
          fi
          python -m compiler.docgen.l0_docgen_blog \
            --input build/docs/markdown \
            --output build/docs/api-reference \
            --docs-prefix "$docs_prefix" \
            --tab-title "$tab_title" \
            --tab-icon "$tab_icon" \
            --tab-order "$tab_order" \
            --html-site-url "$html_site_url" \
            --pdf-url "$pdf_url" \
            --release-tag "$TARGET_RELEASE_TAG"

      - name: Create Dea/L0 API reference export archive
        id: archive
        run: |
          archive_name="dea_l0_api_reference${TARGET_RELEASE_TAG:+-$TARGET_RELEASE_TAG}.tar.gz"
          tar -czf "$archive_name" -C build/docs/api-reference .
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Upload Dea/L0 API reference export artifact
        uses: actions/upload-artifact@v6
        with:
          name: blog-export
          path: l0/${{ steps.archive.outputs.archive_name }}

      - name: Fire repository_dispatch (optional)
        if: vars.BLOG_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.BLOG_PUSH_TOKEN }}
          BLOG_REPO: ${{ vars.BLOG_REPO }}
          TARGET_RELEASE_TAG: ${{ needs.resolve-targets.outputs.target_release_tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::BLOG_REPO is set but BLOG_PUSH_TOKEN is missing; skipping dispatch."
            exit 0
          fi
          gh api "repos/$BLOG_REPO/dispatches" \
            -f event_type=blog-docs-update \
            -f "client_payload[release_tag]=$TARGET_RELEASE_TAG" \
            -f "client_payload[source_repo]=$GITHUB_REPOSITORY" \
            -f "client_payload[source_sha]=$GITHUB_SHA"
