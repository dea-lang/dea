name: L1 CI

on:
  workflow_call:
    inputs:
      platform:
        description: Platform matrix selection
        required: false
        default: all
        type: string
      c_compiler:
        description: C compiler to use for manual Linux or Windows validation runs
        required: false
        default: gcc
        type: string
      make_target:
        description: Make target to run
        required: false
        default: test-ci
        type: string
  workflow_dispatch:
    inputs:
      platform:
        description: Platform matrix selection
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - macos-intel
          - macos-arm64
          - windows-ucrt64
      c_compiler:
        description: C compiler to use for manual Linux or Windows validation runs
        required: true
        default: gcc
        type: choice
        options:
          - gcc
          - clang
      make_target:
        description: Make target to run
        required: true
        default: test-ci
        type: string

permissions:
  contents: read

jobs:
  select-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select matrix
        id: select
        env:
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json
          import os

          default_matrix = [
              {
                  "runner": "ubuntu-latest",
                  "os": "linux",
                  "arch": "x86_64",
                  "c_compiler": "gcc",
                  "platform": "linux",
              },
              {
                  "runner": "macos-15-intel",
                  "os": "darwin",
                  "arch": "x86_64",
                  "c_compiler": "clang",
                  "platform": "macos-intel",
              },
              {
                  "runner": "macos-latest",
                  "os": "darwin",
                  "arch": "arm64",
                  "c_compiler": "clang",
                  "platform": "macos-arm64",
              },
              {
                  "runner": "windows-latest",
                  "os": "windows",
                  "arch": "x86_64",
                  "c_compiler": "gcc",
                  "platform": "windows-ucrt64",
              },
          ]

          requested_platform = os.environ.get("INPUT_PLATFORM", "all").strip() or "all"
          selected = default_matrix
          if requested_platform != "all":
              selected = [entry for entry in default_matrix if entry["platform"] == requested_platform]
              if not selected:
                  raise SystemExit(f"unknown platform selection: {requested_platform}")

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as handle:
              handle.write(f"matrix={json.dumps({'include': selected}, separators=(',', ':'))}\n")
          PY

  bootstrap:
    needs: select-matrix
    name: bootstrap (${{ matrix.runner }}, ${{ matrix.os }}, ${{ matrix.arch }}, ${{ (matrix.os == 'linux' || matrix.os == 'windows') && inputs.c_compiler || matrix.c_compiler }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Select C compiler
        id: select-cc
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "linux" ] || [ "${{ matrix.os }}" = "windows" ]; then
            echo "value=${{ inputs.c_compiler }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ matrix.c_compiler }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: runner.os != 'Windows'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: l1-ci-${{ matrix.platform }}-${{ steps.select-cc.outputs.value }}-py3.14-ws

      - name: Install Linux build toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang make

      - name: Set up MSYS2 UCRT64 toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            make
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-uv

      - name: Show Windows environment
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          printf 'platform=%s\n' '${{ matrix.platform }}'
          printf 'MSYSTEM=%s\n' "${MSYSTEM:-}"
          pwd
          printf 'GITHUB_WORKSPACE=%s\n' "${GITHUB_WORKSPACE:-}"
          command -v python
          python -VV
          command -v uv || true
          uv --version || true
          command -v make
          command -v "${{ steps.select-cc.outputs.value }}"
          "${{ steps.select-cc.outputs.value }}" --version | head -n 1

      - name: Run L1 CI delegate
        uses: ./.github/actions/l1-ci
        with:
          make_target: ${{ inputs.make_target }}
          c_compiler: ${{ steps.select-cc.outputs.value }}
          artifact_name_suffix: ${{ matrix.platform }}-${{ steps.select-cc.outputs.value }}
