name: Copyright Headers

on:
  pull_request:
    paths:
      - ".github/workflows/check_copyright_headers.py"
      - ".github/workflows/copyright-headers.yml"
      - "l*/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check_copyright_headers.py"
      - ".github/workflows/copyright-headers.yml"
      - "l*/**"

jobs:
  check-copyright-headers:
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        shell: bash
        working-directory: .
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          echo "$INPUTS_JSON"

          {
            echo '### Workflow inputs'
            echo '```json'
            printf '%s\n' "$INPUTS_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify source-file copyright notices
        run: python3 .github/workflows/check_copyright_headers.py
