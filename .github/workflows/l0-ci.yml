name: L0 CI

on:
  workflow_call:
    inputs:
      platform:
        description: Platform matrix selection
        required: false
        default: all
        type: string
      c_compiler:
        description: C compiler to use for manual Linux or Windows validation runs
        required: false
        default: gcc
        type: string
      make_target:
        description: Make target to run
        required: false
        default: test-extended
        type: string
  workflow_dispatch:
    inputs:
      platform:
        description: Platform matrix selection
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - macos-intel
          - macos-arm64
          - windows-ucrt64-python
          - windows-mingw64-python
          - windows-native-python
      c_compiler:
        description: C compiler to use for manual Linux or Windows validation runs
        required: true
        default: gcc
        type: choice
        options:
          - gcc
          - clang
      make_target:
        description: Make target to run
        required: true
        default: test-extended
        type: string

permissions:
  contents: read

jobs:
  select-matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Show inputs
        shell: bash
        working-directory: .
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          echo "$INPUTS_JSON"

          {
            echo '### Workflow inputs'
            echo '```json'
            printf '%s\n' "$INPUTS_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select matrix
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json
          import os

          default_matrix = [
              {
                  "runner": "ubuntu-26.04",
                  "os": "linux",
                  "arch": "x86_64",
                  "c_compiler": "gcc",
                  "platform": "linux",
                  "msystem": "",
                  "msys2_package_prefix": "",
              },
              {
                  "runner": "macos-15-intel",
                  "os": "darwin",
                  "arch": "x86_64",
                  "c_compiler": "clang",
                  "platform": "macos-intel",
                  "msystem": "",
                  "msys2_package_prefix": "",
              },
              {
                  "runner": "macos-latest",
                  "os": "darwin",
                  "arch": "arm64",
                  "c_compiler": "clang",
                  "platform": "macos-arm64",
                  "msystem": "",
                  "msys2_package_prefix": "",
              },
              {
                  "runner": "windows-latest",
                  "os": "windows",
                  "arch": "x86_64",
                  "c_compiler": "gcc",
                  "platform": "windows-ucrt64-python",
                  "msystem": "UCRT64",
                  "msys2_package_prefix": "mingw-w64-ucrt-x86_64",
              },
          ]
          manual_only_matrix = [
              {
                  "runner": "windows-latest",
                  "os": "windows",
                  "arch": "x86_64",
                  "c_compiler": "gcc",
                  "platform": "windows-mingw64-python",
                  "msystem": "MINGW64",
                  "msys2_package_prefix": "mingw-w64-x86_64",
              },
          ]

          event_name = os.environ["EVENT_NAME"]
          requested_platform = os.environ.get("INPUT_PLATFORM", "all").strip() or "all"
          # Retain the old selector as an alias; both lanes now use native tooling.
          if requested_platform == "windows-native-python":
              requested_platform = "windows-mingw64-python"
          selected = default_matrix
          if event_name in {"workflow_dispatch", "workflow_call"}:
              dispatch_matrix = default_matrix + manual_only_matrix
              if requested_platform == "all":
                  selected = dispatch_matrix
              else:
                  selected = [entry for entry in dispatch_matrix if entry["platform"] == requested_platform]
                  if not selected:
                      raise SystemExit(f"unknown platform selection: {requested_platform}")

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as handle:
              handle.write(f"matrix={json.dumps({'include': selected}, separators=(',', ':'))}\n")
          PY

  test-extended:
    needs: select-matrix
    name: test-extended (${{ matrix.runner }}, ${{ matrix.os }}, ${{ matrix.arch }}, ${{ (matrix.os == 'linux' || matrix.os == 'windows') && inputs.c_compiler || matrix.c_compiler }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Show inputs
        shell: bash
        working-directory: .
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          echo "$INPUTS_JSON"

          {
            echo '### Workflow inputs'
            echo '```json'
            printf '%s\n' "$INPUTS_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Select C compiler
        id: select-cc
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "linux" ] || [ "${{ matrix.os }}" = "windows" ]; then
            echo "value=${{ inputs.c_compiler }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ matrix.c_compiler }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: runner.os != 'Windows'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ci-${{ matrix.platform }}-${{ steps.select-cc.outputs.value }}-py3.14-ws

      - name: Install Linux build toolchain
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang make

      - name: Set up MSYS2 toolchain and UCRT64 test Python
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          install: >-
            make
            diffutils
            ${{ matrix.msys2_package_prefix }}-gcc
            ${{ matrix.msys2_package_prefix }}-clang
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip

      - name: Set up Windows Python environments
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-python
        with:
          msys2_stage1: "true"

      - name: Set up Doxygen
        id: doxygen
        uses: ./.github/actions/setup-doxygen

      - name: Show Windows environment
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          printf 'platform=%s\n' '${{ matrix.platform }}'
          printf 'MSYSTEM=%s\n' "${MSYSTEM:-}"
          command -v doxygen
          test "$(doxygen --version)" = '${{ steps.doxygen.outputs.version }}'
          pwd
          printf 'GITHUB_WORKSPACE=%s\n' "${GITHUB_WORKSPACE:-}"
          printf 'Native Python: %s\n' "$HOST_PYTHON"
          "$HOST_PYTHON" -VV
          command -v uv || true
          uv --version || true
          command -v "${{ steps.select-cc.outputs.value }}"
          "${{ steps.select-cc.outputs.value }}" --version | head -n 1

      - name: Run L0 CI delegate
        uses: ./.github/actions/l0-ci
        with:
          make_target: ${{ inputs.make_target }}
          c_compiler: ${{ steps.select-cc.outputs.value }}
          artifact_name_suffix: ${{ matrix.platform }}-${{ steps.select-cc.outputs.value }}
