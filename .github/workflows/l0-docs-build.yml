name: L0 Build Documentation

on:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
        default: ""
      release_tag:
        required: false
        type: string
        default: ""
      stage:
        required: false
        type: string
        default: stage2
      package_version:
        required: false
        type: string
        default: ""
      build_pdf:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-docs:
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(inputs.stage == 'all' && '["stage1", "stage2"]' || format('["{0}"]', inputs.stage)) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: l0
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: >-
            ${{
              inputs.release_tag != '' &&
              inputs.source_ref == inputs.release_tag &&
              format('refs/tags/{0}', inputs.release_tag) ||
              (inputs.source_ref != '' && inputs.source_ref || github.sha)
            }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: docs-build-py3.14-ws

      - name: Install docs toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            doxygen \
            graphviz \
            make

      - name: Show Doxygen version
        run: doxygen --version

      - name: Install TeX toolchain
        if: inputs.build_pdf
        run: |
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Sync docs dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --group docs

      - name: Build HTML, Markdown, LaTeX, and PDF
        env:
          DOC_STAGE: ${{ matrix.stage }}
          L0_DOCS_RELEASE_TAG: ${{ inputs.release_tag }}
          DEA_DIST_VERSION: ${{ inputs.package_version }}
        run: |
          if [ -z "$DEA_DIST_VERSION" ] && [ -n "$L0_DOCS_RELEASE_TAG" ]; then
            export DEA_DIST_VERSION="${L0_DOCS_RELEASE_TAG#l0-}"
            export DEA_DIST_VERSION="${DEA_DIST_VERSION#v}"
          fi
          python3 scripts/gen_docs.py --stage "$DOC_STAGE" ${{ inputs.build_pdf && '--pdf --artifacts' || '' }} --strict

      - name: Stage Pages site
        if: matrix.stage == 'stage2'
        run: python3 scripts/stage_docs_pages.py

      - name: Upload Pages artifact
        if: matrix.stage == 'stage2'
        uses: actions/upload-pages-artifact@v5
        with:
          path: l0/build/docs/pages-site

      - name: Upload generated Markdown artifact
        uses: actions/upload-artifact@v6
        with:
          name: l0-docs-${{ matrix.stage }}-markdown
          path: l0/build/docs/${{ matrix.stage }}/markdown

      - name: Upload generated PDF artifact
        if: inputs.build_pdf
        uses: actions/upload-artifact@v6
        with:
          name: l0-docs-${{ matrix.stage }}-pdf
          path: l0/build/docs/${{ matrix.stage }}/pdf/dea_l0_${{ matrix.stage }}_api_reference.pdf

      - name: Upload verified offline bundle
        if: inputs.build_pdf
        uses: actions/upload-artifact@v6
        with:
          name: l0-docs-${{ matrix.stage }}-autodocs
          path: l0/build/docs/artifacts/dea_l0_${{ matrix.stage }}_autodocs.tar.gz
          if-no-files-found: error
